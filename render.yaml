# HộiRoom: one paid instance is intentional while rooms and queues are in memory.
# Create via Render Dashboard > New > Blueprint > connect this branch.
services:
  - type: web
    name: hoiroom-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: DEMO_WALLET_ENABLED
        value: "false"
      - key: PAYMENTS_MODE
        value: disabled
      - key: UPLOAD_ROOT
        value: /app/storage
      - key: DATABASE_URL
        fromDatabase:
          name: hoiroom-postgres
          property: connectionString
    disk:
      name: hoiroom-media
      mountPath: /app/storage
      sizeGB: 1

databases:
  - name: hoiroom-postgres
    databaseName: hoiroom
    user: hoiroom
    region: singapore
    plan: 0.1c-256mb
