name: HộiRoom checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Historical lockfile predates the pg dependency; npm install syncs it until the lock is regenerated.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
